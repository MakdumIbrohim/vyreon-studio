name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Native Core Engine
        run: |
          cd native/rust_engine
          cargo build --release

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Split per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename APK Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-output/vyreon-studio-arm64-v8a-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-output/vyreon-studio-armeabi-v7a-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-output/vyreon-studio-x86_64-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/vyreon-studio-universal-${VERSION}.apk"
          ls -lh release-output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vyreon Studio ${{ github.ref_name }}"
          files: release-output/*.apk
          generate_release_notes: false
          body: |
            ### Vyreon Studio ${{ github.ref_name }} Release

            Android release packages:
            - **`vyreon-studio-arm64-v8a-${{ github.ref_name }}.apk`**: 64-bit ARM (rekomendasi untuk HP Android modern).
            - **`vyreon-studio-armeabi-v7a-${{ github.ref_name }}.apk`**: 32-bit ARM (perangkat Android lama).
            - **`vyreon-studio-x86_64-${{ github.ref_name }}.apk`**: Emulator Android & Chromebook.
            - **`vyreon-studio-universal-${{ github.ref_name }}.apk`**: Paket gabungan universal (kompatibel semua arsitektur).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
